[project]
name = "todocli"
version = "0.1.0.dev0"
description = "Personal task tracker"
authors = [
    {name = "Omar Kohl", email = "omarkohl@posteo.net"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["black"]

[project.scripts]
todocli = "todocli.cli:cli"

[tool.black]
line-length = 88
target-version = ['py312']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
